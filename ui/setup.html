<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kira Setup</title>
<style>
:root{color-scheme:dark;font:15px system-ui;color:#fff;background:#14243b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 75% 0,#164b74aa,transparent 70%);padding:30px 36px}button,input,select{font:inherit;color:inherit;border:1px solid #ffffff30;border-radius:14px;background:#ffffff0b;padding:11px 15px}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #67caff;outline-offset:3px}.primary{background:#1769c5}header,footer,.row{display:flex;align-items:center;gap:12px}header{justify-content:space-between;color:#bdd7ee}main{min-height:420px;padding:28px 0 20px}h1{font-size:31px;font-weight:550;letter-spacing:-.8px;margin:0 0 12px}p{color:#c5d7e9;line-height:1.6}.stack{display:grid;gap:12px}.card{padding:15px;border:1px solid #ffffff25;border-radius:18px;background:#ffffff09}.row>*{flex:1}label{display:grid;gap:6px;color:#c5d7e9}.languages{max-height:240px;overflow:auto}.language{display:flex;align-items:center;gap:10px;padding:9px}.language input{width:18px;height:18px}.language span{flex:1}.language button{padding:5px 9px}footer{justify-content:space-between;border-top:1px solid #ffffff20;padding-top:18px}#notice{min-height:24px;color:#b7e5ff}small{color:#adc2da}select option{background:#14243b}.pill{border-radius:10px;padding:4px 8px;background:#ffffff12}progress{width:100%}@media(max-width:600px){body{padding:20px}.row{flex-wrap:wrap}h1{font-size:27px}}@media(prefers-reduced-motion:no-preference){main{animation:appear .5s ease-out}@keyframes appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}}
</style></head><body><header><b>Kira</b><span id="position" aria-live="polite"></span></header><main id="content"></main><p id="notice" role="status" aria-live="polite"></p><footer><button id="back">Back</button><button id="next" class="primary">Continue</button></footer>
<script>/*CATALOG*/</script><script>/*SETUP*/</script></body></html>
